# Публикация демо на GitHub Pages.
#
# Приложение статическое — сборка не требуется, в артефакт кладётся только то,
# что нужно браузеру. Тайлы подложки загружаются с внешних сервисов уже в
# браузере посетителя, поэтому на Pages карта отображается полностью.

name: Демо на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации не нужны, но начатую не прерываем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить Pages
        uses: actions/configure-pages@v5
        with:
          # Включает Pages при первой публикации, чтобы не настраивать вручную.
          enablement: true

      - name: Собрать содержимое сайта
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src styles vendor _site/

      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
